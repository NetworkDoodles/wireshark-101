# The web host's server: plain HTTP on port 80 and HTTPS on 443, for two names.
# Nothing listens on 8080, so a connection there is refused (chapter 6).
worker_processes 1;
error_log /var/log/nginx/error.log warn;
events { worker_connections 64; }
http {
    access_log /var/log/nginx/access.log;
    default_type text/plain;
    sendfile on;
    keepalive_timeout 5;
    ssl_certificate     /etc/lab-tls/web.crt;
    ssl_certificate_key /etc/lab-tls/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name web.lab;
        root /srv/www;
    }
    server {
        listen 443 ssl;
        server_name intranet.lab;
        root /srv/intranet;
    }
}

hostname r1
!
! The home network's gateway. DHCP isn't served here: r1 relays the laptop's requests to the DHCP server
! on dns, two hops away (ip helper-address), so chapter 4 can watch a relay at work.
interface GigabitEthernet1
 description home network (sw1)
 ip address 192.168.1.1 255.255.255.0
 ip helper-address 192.168.2.53
 no shutdown
!
interface GigabitEthernet2
 description link to r2
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
! Both server networks, 192.168.2.0/28 and 192.168.2.48/28, are inside 192.168.2.0/24: one route covers them.
ip route 192.168.2.0 255.255.255.0 10.0.0.2
!
end

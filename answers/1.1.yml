# Task 1.1 · your first capture
# Write each answer after its colon, save the file, then run:  make check T=1.1
# The capture: make capture AT=laptop:eth1 NAME=1.1 X=ping
# Guide: https://networkdoodles.com/labs/wireshark-101/task-1-1/

# Follow along
first_protocol: arp   # The protocol of the first frame the laptop sent, like ICMP
echo_requests: 4   # How many echo (ping) requests the laptop sent

# Challenge
printer_mac: aa:aa:aa:22:22:22   # The printer's MAC address, from the Ethernet header of a reply
reply_ttl: 64   # The TTL in the printer's replies
